<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1211" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f4f2" media="(prefers-color-scheme: light)">
<title>Pair your phone</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<style>
  .pair { max-width: 440px; margin: 0 auto; padding: calc(32px + env(safe-area-inset-top)) 20px 0; }
  .pair h1 { margin: 0 0 8px; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .pair .lead { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
  .qr {
    display: block;
    width: min(100%, 300px);
    aspect-ratio: 1;
    margin: 0 auto 14px;
    padding: 12px;
    border-radius: var(--radius);
    background: #fff;
    box-shadow: var(--shadow);
  }
  .qr svg { display: block; width: 100%; height: 100%; }
  .address { text-align: center; font-variant-numeric: tabular-nums; font-size: 15px; margin: 0 0 24px; }
  .address small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .actions { display: grid; gap: 10px; margin-bottom: 8px; }
  a.primary { display: block; text-align: center; text-decoration: none; line-height: 48px; min-height: 48px; padding: 0 13px; border-radius: var(--radius-sm); background: var(--accent); color: var(--on-accent); font-weight: 680; }
  .startup { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 20px 0 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
  .startup span { font-weight: 580; }
  .startup small { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; font-weight: 400; line-height: 1.4; }
  .startup input { flex: none; width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; }
  .help { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 18px 0 0; }
  .others .qr { width: min(100%, 220px); padding: 8px; }
  .others .address { margin-bottom: 20px; }
  .empty { padding: 32px 0; text-align: center; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
<main class="pair" id="pair">
  <h1>Pair your phone</h1>
  <p class="lead">Scan this with your phone's camera. The phone has to be on the same Wi-Fi as this PC.</p>
  <div id="content"><div class="empty">Loading…</div></div>
</main>
<script src="pair.js"></script>
</body>
</html>
